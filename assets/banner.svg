<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(1); }
      }
      @keyframes floatShape1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatShape2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .bg-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .float-1 { animation: floatShape1 8s ease-in-out infinite; transform-origin: center; }
      .float-2 { animation: floatShape2 10s ease-in-out infinite; transform-origin: center; }
      .tech-line { stroke-dasharray: 10 15; animation: dashMove 20s linear infinite; }
      .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #e0e7ff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Background Orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad)" class="bg-pulse" />
  <circle cx="1000" cy="300" r="220" fill="url(#glowGrad)" class="bg-pulse" style="animation-delay: -3s;" />

  <!-- Background Decorative Tech Lines -->
  <path d="M 50 350 L 250 350 L 320 280 L 880 280 L 950 350 L 1150 350" fill="none" stroke="#334155" stroke-width="2" class="tech-line" />
  <path d="M 100 50 L 300 50 L 370 120 L 830 120 L 900 50 L 1100 50" fill="none" stroke="#334155" stroke-width="2" class="tech-line" />

  <!-- Floating Dynamic Tech Cards (Placed in background/sides to keep title unobstructed) -->
  <g class="float-1">
    <rect x="70" y="110" width="180" height="100" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1.5" />
    <path d="M 90 140 L 150 140" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
    <path d="M 90 160 L 210 160" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <path d="M 90 180 L 180 180" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  </g>

  <g class="float-2">
    <rect x="950" y="180" width="180" height="110" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1.5" />
    <circle cx="990" cy="220" r="16" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
    <path d="M 1020 215 L 1100 215" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
    <path d="M 1020 230 L 1080 230" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <rect x="990" y="255" width="110" height="12" rx="6" fill="#334155" />
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(450, 60)">
    <rect x="0" y="0" width="300" height="36" rx="18" fill="url(#accentGrad)" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
    <text x="150" y="23" class="badge-text" font-size="14" text-anchor="middle">💻 2-IN-1 CONVERTIBLES &amp; STYLUS TECH ✏️</text>
  </g>

  <!-- Foreground Title and Subtitle (Unobstructed & Dynamic Gradient Accent) -->
  <text x="600" y="165" class="title-text" font-size="46" text-anchor="middle" filter="url(#glow)">Awesome Convertible Laptop Hardware</text>
  <text x="600" y="215" class="subtitle-text" font-size="20" text-anchor="middle">Curated Hardware, Open-Source Software, Stylus Tools &amp; Linux Compatibility Guide</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(260, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="200" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5" />
    <text x="100" y="26" class="badge-text" font-size="14" text-anchor="middle">💻 Commercial 2-in-1s</text>

    <!-- Pill 2 -->
    <rect x="230" y="0" width="220" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5" />
    <text x="340" y="26" class="badge-text" font-size="14" text-anchor="middle">🔓 Open-Source Software</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="210" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="#ec4899" stroke-width="1.5" />
    <text x="575" y="26" class="badge-text" font-size="14" text-anchor="middle">🐧 Linux &amp; Stylus Support</text>
  </g>
</svg>
